<script>
const SHEET_ID="11FaYvh3o4v-qkKbaLWcUgQYAAeXidX0rx6m3NsnRnY8";
const SHEETS={players:"선수",stats:"스탯",transfers:"이적",youth:"유스",leagues:"리그"};
let players=[],stats=[],transfers=[],youth=[],leagues=[],searchType="all",currentPlayer=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function val(o,names){for(const n of names)if(o[n]!==undefined&&String(o[n]).trim()!=="")return String(o[n]);return ""}
function parseGviz(text){const a=text.indexOf("{"),b=text.lastIndexOf("}");if(a<0||b<0)throw new Error("Google Sheets 응답을 읽을 수 없습니다.");const d=JSON.parse(text.slice(a,b+1));const cols=d.table.cols.map(c=>c.label||"");return d.table.rows.map(r=>{const o={};cols.forEach((c,i)=>o[c]=r.c?.[i]?.v!=null?String(r.c[i].v):"");return o})}
async function loadSheet(sheet){const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(sheet);const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);return parseGviz(await r.text())}
const STATS_HEADERS=[
  "선수명","시즌","대회","명단 포함","출전","출전 시간","선발 출전","교체 출전","교체 아웃",
  "골 (왼발/헤더/오른발/기타)","어시스트","옐로/옐로 누적 레드/레드",
  "패스 성공률 (성공한 패스 횟수)","롱 패스 정확도 (정확한 롱 패스 횟수)",
  "GK 실점 수","클린시트 횟수","선방률 (총 선방 횟수)"
];

function parseGvizFixed(text, headers){
  const a=text.indexOf("{"), b=text.lastIndexOf("}");
  if(a<0||b<0) throw new Error("Google Sheets 응답을 읽을 수 없습니다.");
  const d=JSON.parse(text.slice(a,b+1));
  return (d.table.rows||[]).slice(1).map(r=>{
    const o={};
    headers.forEach((h,i)=>o[h]=r.c?.[i]?.v!=null?String(r.c[i].v):"");
    return o;
  });
}

async function loadStatsSheet(){
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(SHEETS.stats);
  const r=await fetch(url);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return parseGvizFixed(await r.text(),STATS_HEADERS);
}

function cellValue(cell){
  if(!cell) return "";
  if(cell.v!==undefined && cell.v!==null) return String(cell.v);
  if(cell.f!==undefined && cell.f!==null) return String(cell.f);
  return "";
}

function parseLeagueGviz(text){
  const a=text.indexOf("{"), b=text.lastIndexOf("}");
  if(a<0||b<0) throw new Error("리그 시트 응답을 읽을 수 없습니다.");
  const d=JSON.parse(text.slice(a,b+1));
  return (d.table.rows||[]).map(r=>{
    const c=r.c||[];
    const row={
      "사진":cellValue(c[0]),
      "리그명":cellValue(c[1]),
      "국가":cellValue(c[2])
    };
    return row;
  }).filter(row=>{
    const name=row["리그명"].trim();
    const country=row["국가"].trim();
    return !(name==="리그명" && country==="국가");
  });
}

async function loadLeaguesSheet(){
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(SHEETS.leagues)+"&range=A:C";
  const r=await fetch(url);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return parseLeagueGviz(await r.text());
}

async function loadData(){
  const results=await Promise.allSettled([
    loadSheet(SHEETS.players),
    loadStatsSheet(),
    loadSheet(SHEETS.transfers),
    loadSheet(SHEETS.youth),
    loadLeaguesSheet()
  ]);
  const names=["선수","스탯","이적","유스","리그"];
  const values=[players,stats,transfers,youth,leagues];
  results.forEach((res,i)=>{
    if(res.status==="fulfilled") values[i]=res.value;
    else console.error(names[i]+" 시트 불러오기 실패:",res.reason);
  });
  [players,stats,transfers,youth,leagues]=values;
  const failed=results.map((r,i)=>r.status==="rejected"?names[i]:"").filter(Boolean);
  $("status").textContent=`Google Sheets 연결 · 리그 ${countUnique(players,["리그","리그명"])}개 · 클럽 ${countUnique(players,["팀","클럽명"])}팀 · 선수 ${players.length}명`;
  $("status").style.color=failed.length?"#e8c56a":"var(--good)";
}
function countUnique(rows,names){
  const set=new Set();
  rows.forEach(r=>{
    const v=val(r,names).trim();
    if(v) set.add(v);
  });
  return set.size;
}
function playerName(p){return val(p,["한글 선수명","선수명","한글 풀네임"])||val(p,["로마자 선수명","로마자 이름","로마자 풀네임"])||"이름 없음"}
function samePlayer(row,p){const a=[val(row,["선수명","한글 선수명","선수명(한글)"]),val(row,["한글 풀네임"]),val(row,["로마자 이름","로마자 풀네임"])].filter(Boolean).map(x=>x.trim().toLowerCase());const b=[playerName(p),val(p,["한글 본명","한글 풀네임"]),val(p,["로마자 선수명","로마자 이름","로마자 풀네임"])].filter(Boolean).map(x=>x.trim().toLowerCase());return a.some(x=>b.includes(x))}
function searchable(p){if(searchType==="player")return [playerName(p),val(p,["한글 본명","한글 풀네임"]),val(p,["로마자 선수명","로마자 이름","로마자 풀네임"])];if(searchType==="team")return [val(p,["팀","클럽명"])];if(searchType==="country")return [val(p,["국적","국가"])];if(searchType==="league")return [val(p,["리그","리그명"])];return Object.values(p)}
function sortSearchResults(list){
  return [...list].sort((a,b)=>{
    if(searchType==="team"){
      const an=parseInt(val(a,["등번호"]).replace(/[^0-9]/g,""),10);
      const bn=parseInt(val(b,["등번호"]).replace(/[^0-9]/g,""),10);
      if(Number.isFinite(an)&&Number.isFinite(bn)&&an!==bn) return an-bn;
      if(Number.isFinite(an)&&!Number.isFinite(bn)) return -1;
      if(!Number.isFinite(an)&&Number.isFinite(bn)) return 1;
    }
    return playerName(a).localeCompare(playerName(b),"ko",{numeric:true,sensitivity:"base"});
  });
}
function renderResults(list){list=sortSearchResults(list);const box=$("results");if(!list.length){box.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}box.innerHTML=list.slice(0,50).map((p,i)=>{const name=playerName(p),roman=val(p,["로마자 선수명","로마자 이름","로마자 풀네임"]),pos=val(p,["포지션"]),league=val(p,["리그","리그명"]),team=val(p,["팀","클럽명"]),nation=val(p,["국적","국가"]);return `<div class="result" data-i="${i}"><div><div class="result-name">${esc(name)}</div><div class="result-meta">${esc([roman,pos,league,team,nation].filter(Boolean).join(" · "))}</div></div><div class="badge">${esc(pos||"PLAYER")}</div></div>`}).join("");box.querySelectorAll(".result").forEach(el=>el.addEventListener("click",()=>showDetail(list[Number(el.dataset.i)])))}
function detailItem(label,value){return value?`<div class="detail-item"><span>${esc(label)}</span><b>${esc(value)}</b></div>`:""}
function photoHtml(p,name){
  const photo=val(p,["사진","사진 URL","사진URL"]);
  return photo
    ? `<img class="photo" src="${esc(photo)}" alt="${esc(name)}">`
    : `<div class="avatar">${esc(name.slice(0,1))}</div>`;
}
function renderPositionLevels(text){
  if(!text) return "";
  return String(text).split(",").map(part=>{
    const raw=part.trim();
    const match=raw.match(/^(.+?)\((\d+)\)$/);
    if(!match) return `<span class="position-tag">${esc(raw)}</span>`;
    const position=match[1].trim();
    const level=match[2];
    return `<span class="position-tag position-level-${esc(level)}">${esc(position)}</span>`;
  }).join(" ");
}

function showDetail(p){
  currentPlayer=p;
  const d=$("detail"), name=playerName(p), roman=val(p,["로마자 선수명","로마자 이름","로마자 풀네임"]);
  const fields=[
    ["등번호",val(p,["등번호"])],
    ["포지션",val(p,["포지션"])],
    ["세부 포지션",val(p,["세부 포지션"])],
    ["팀",val(p,["팀","클럽명"])],
    ["국적",val(p,["국적","국가"])],
    ["생년월일",val(p,["생년월일"])],
    ["주발",val(p,["주발"])],
    ["키",val(p,["키(cm)","키"])],
    ["몸무게",val(p,["몸무게(kg)","몸무게"])],
    ["비고",val(p,["비고"])]
  ];
  d.innerHTML=`<div class="detail-search-wrap">
    <input id="detailSearch" class="detail-search" autocomplete="off" placeholder="선수명, 팀명, 국가, 리그를 검색하세요.">
    <div id="detailSearchResults" class="detail-search-results"></div>
  </div>
  <div class="player-hero">
    <div class="player-photo">${photoHtml(p,name)}</div>
    <div class="player-identity">
      <div class="player-name-line">
        <span class="shirt-number">#${esc(val(p,["등번호"]))}</span>
        <div class="player-name-block">
          <h2>${esc(name)}</h2>
          <div class="detail-sub">${esc(roman)}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="player-info-grid">
    <div class="info-card name-card">
      <span class="info-label">본명</span>
      <div class="info-main">${esc(val(p,["한글 본명","한글 풀네임"]))}</div>
      <div class="info-sub">${esc(val(p,["로마자 본명","로마자 풀네임"]))}</div>
    </div>
    <div class="info-card">
      <span class="info-label">생년월일</span>
      <div class="info-main">${esc(val(p,["생년월일"]))}</div>
    </div>
    <div class="info-card">

function searchPlayers(q){
  q=String(q||"").trim().toLowerCase();
  if(!q) return [];
  return players.filter(p=>searchable(p).some(v=>String(v).toLowerCase().includes(q)));
}
function setupDetailSearch(){
  const input=$("detailSearch"), box=$("detailSearchResults");
  if(!input) return;
  input.addEventListener("input",()=>{
    const q=input.value.trim();
    if(!q){box.innerHTML="";box.classList.remove("show");return;}
    const found=sortSearchResults(searchPlayers(q));
    if(!found.length){box.innerHTML='<div class="empty" style="padding:18px">검색 결과가 없습니다.</div>';box.classList.add("show");return;}
    box.innerHTML=found.slice(0,50).map((p,i)=>{
      const name=playerName(p), roman=val(p,["로마자 선수명","로마자 이름","로마자 풀네임"]), pos=val(p,["포지션"]), league=val(p,["리그","리그명"]), team=val(p,["팀","클럽명"]), nation=val(p,["국적","국가"]);
      return `<div class="detail-search-result" data-i="${i}"><b>${esc(name)}</b><div class="result-meta">${esc([roman,pos,league,team,nation].filter(Boolean).join(" · "))}</div></div>`;
    }).join("");
    box.classList.add("show");
    box.querySelectorAll(".detail-search-result").forEach(el=>el.addEventListener("click",()=>{
      showDetail(found[Number(el.dataset.i)]);
    }));
  });
  input.addEventListener("keydown",e=>{
    if(e.key!=="Enter") return;
    e.preventDefault();
    const found=sortSearchResults(searchPlayers(input.value));
    if(found.length===1){
      box.classList.remove("show");
      showDetail(found[0]);
    }else if(found.length>1){
      box.innerHTML=found.slice(0,50).map((p,i)=>{
        const name=playerName(p), roman=val(p,["로마자 선수명","로마자 이름","로마자 풀네임"]), pos=val(p,["포지션"]), league=val(p,["리그","리그명"]), team=val(p,["팀","클럽명"]), nation=val(p,["국적","국가"]);
        return `<div class="detail-search-result" data-i="${i}"><b>${esc(name)}</b><div class="result-meta">${esc([roman,pos,league,team,nation].filter(Boolean).join(" · "))}</div></div>`;
      }).join("");
      box.classList.add("show");
    }
  });
}
function switchTab(tab){$("detail").querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));$("detail").querySelectorAll(".tab-panel").forEach(x=>x.classList.toggle("active",x.id==="panel-"+tab))}
function table(headers,rows){if(!rows.length)return '<div class="table-empty">등록된 데이터가 없습니다.</div>';return `<div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function renderStats(p){
  const rows=stats.filter(r=>samePlayer(r,p));

  const headers=STATS_HEADERS.slice(1);
  return table(headers,rows.map(r=>headers.map(h=>val(r,[h]))));
}
function renderTransfers(p){const rows=transfers.filter(r=>samePlayer(r,p));if(!rows.length)return '<div class="table-empty">이적 기록이 아직 없습니다.</div>';const headers=["합류일","이적 형태","이전 팀","이전 팀 국가","이적 팀","이적 팀 국가"];return table(headers,rows.map(r=>headers.map(h=>{const v=val(r,[h]);return h==="합류일"&&!v?"-":v;})))}
function renderYouth(p){const rows=youth.filter(r=>samePlayer(r,p));if(!rows.length)return '<div class="table-empty">유스 경력이 아직 없습니다.</div>';const headers=["합류일","이전 팀","이전 팀 국가","이적 팀","이적 팀 국가"];return table(headers,rows.map(r=>headers.map(h=>{const v=val(r,[h]);return h==="합류일"&&!v?"-":v;})))}

              <div><div class="result-name">${esc(name)}</div><div class="result-meta">${esc(country)}</div></div>

function openLeague(league){
  const leagueRow=leagues.find(l=>val(l,["리그명"]).trim()===league.trim());

  )].sort((a,b)=>a.localeCompare(b,"ko",{numeric:true,sensitivity:"base"}));

      </div>
    </div>

  detail.querySelectorAll(".league-club-result").forEach(el=>{
