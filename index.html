<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAVE FOOTBALL</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#101114;--panel:#17191d;--panel2:#1c1f24;--line:#2b2e35;
  --text:#fff;--muted:#9297a3;--accent:#6d75ff;--accent2:#858cff;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;min-height:100vh}
button,input{font:inherit}
button{color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:210px minmax(0,1fr) 210px}
.sidebar{background:var(--panel);padding:26px 18px;border-right:1px solid var(--line)}
.sidebar.right{border-right:0;border-left:1px solid var(--line)}
.brand{font-size:23px;font-weight:800;letter-spacing:.3px;margin:0 0 32px;cursor:pointer}
.section-title{font-size:12px;color:var(--muted);margin:0 0 12px}
.fav{display:flex;align-items:center;gap:9px;width:100%;padding:10px 8px;border:0;background:transparent;border-radius:8px;text-align:left;cursor:pointer;color:#ddd}
.fav:hover{background:#202329}
.center{min-width:0;padding:34px 46px}
.center-inner{max-width:1050px;margin:0 auto}
.topline{height:24px;margin-bottom:42px}
.search-wrap{position:relative}
.search{width:100%;height:62px;padding:0 22px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:#fff;outline:none;font-size:18px}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:#747986}
.search-menu{display:none;position:absolute;z-index:5;top:70px;left:0;right:0;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;box-shadow:0 15px 40px #0008}
.search-menu.show{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.type-btn{padding:13px 10px;border:1px solid var(--line);border-radius:9px;background:#202329;color:#ddd;cursor:pointer}
.type-btn:hover,.type-btn.active{background:#292d45;border-color:var(--accent);color:#fff}
.status{margin:14px 0 0;color:var(--muted);font-size:13px}
.results{margin-top:22px;display:grid;gap:9px}
.result{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}
.result:hover{border-color:#555b72;background:#1b1e24}
.result-name{font-size:17px;font-weight:700}
.result-meta{margin-top:5px;color:var(--muted);font-size:13px}
.badge{font-size:12px;color:#b9beff;background:#292d4d;padding:5px 8px;border-radius:6px}
.empty{color:#777d88;text-align:center;padding:55px 10px}
.detail{display:none;margin-top:22px;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.detail.show{display:block}
.detail-head{display:flex;gap:20px;align-items:flex-start}
.avatar{width:82px;height:82px;border-radius:14px;background:#252830;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;color:#aeb3ff}
.detail h2{margin:0 0 6px;font-size:25px}
.detail-sub{color:var(--muted);font-size:14px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.detail-item{padding:12px;background:#1d2025;border-radius:9px}
.detail-item span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.detail-item b{font-size:14px}
.back{margin-top:18px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:#202329;cursor:pointer}
.browse{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;text-align:left;font-weight:700}
.browse:hover{border-color:var(--accent)}
.right-note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar,.sidebar.right{display:none}
  .center{padding:24px 18px}
  .search-menu.show{grid-template-columns:repeat(2,1fr)}
  .detail-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand" onclick="goHome()">WAVE FOOTBALL</div>
    <div class="section-title">즐겨찾기</div>
    <button class="fav">🏴 프리미어리그</button>
    <button class="fav">🇪🇸 라리가</button>
    <button class="fav">🇮🇹 세리에 A</button>
    <button class="fav">🇩🇪 분데스리가</button>
    <button class="fav">🇰🇷 K리그1</button>
  </aside>

  <main class="center">
    <div class="center-inner">
      <div class="topline"></div>

      <div class="search-wrap">
        <input id="search" class="search" autocomplete="off"
          placeholder="선수명, 팀명, 국가를 검색하세요.">
        <div id="searchMenu" class="search-menu">
          <button class="type-btn active" data-type="all">전체 검색</button>
          <button class="type-btn" data-type="player">선수명 검색</button>
          <button class="type-btn" data-type="team">팀명 검색</button>
          <button class="type-btn" data-type="country">국가 검색</button>
        </div>
      </div>

      <div id="status" class="status">Google Sheets에서 선수 데이터를 불러오는 중...</div>
      <div id="results" class="results">
        <div class="empty">검색창을 눌러 검색 유형을 선택하세요.</div>
      </div>

      <section id="detail" class="detail"></section>
    </div>
  </main>

  <aside class="sidebar right">
    <button class="browse" onclick="browse()">⚽ 축구 정보 찾아보기</button>
    <div class="right-note">국가, 리그, 클럽, 유스, 포지션, 생일 등 여러 기준으로 선수를 찾아볼 수 있는 공간입니다.</div>
  </aside>
</div>

<script>
const SHEET_ID="11FaYvh3o4v-qkKbaLWcUgQYAAeXidX0rx6m3NsnRnY8";
const SHEET_NAME="선수";
let players=[];
let searchType="all";

const $=id=>document.getElementById(id);

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function val(o,names){
  for(const n of names) if(o[n]!==undefined && String(o[n]).trim()!=="") return String(o[n]);
  return "";
}
function parseGviz(text){
  const a=text.indexOf("{"),b=text.lastIndexOf("}");
  if(a<0||b<0) throw new Error("Google Sheets 응답을 읽을 수 없습니다.");
  const d=JSON.parse(text.slice(a,b+1));
  const cols=d.table.cols.map(c=>c.label||"");
  return d.table.rows.map(r=>{
    const o={};
    cols.forEach((c,i)=>o[c]=r.c?.[i]?.v!=null?String(r.c[i].v):"");
    return o;
  });
}
async function loadPlayers(){
  const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+
    "/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(SHEET_NAME);
  try{
    const r=await fetch(url);
    if(!r.ok) throw new Error("HTTP "+r.status);
    players=parseGviz(await r.text());
    $("status").textContent="Google Sheets 연결 성공 · "+players.length+"명의 데이터를 불러왔습니다.";
    $("status").style.color="#72d68a";
  }catch(e){
    $("status").textContent="Google Sheets 연결 실패: "+e.message;
    $("status").style.color="#ff7b7b";
  }
}
function searchable(p){
  if(searchType==="player") return [val(p,["한글 선수명","선수명","한글 풀네임"]),val(p,["로마자 이름","로마자 풀네임"])];
  if(searchType==="team") return [val(p,["팀","클럽명"])];
  if(searchType==="country") return [val(p,["국적","국가"])];
  return Object.values(p);
}
function renderResults(list){
  const box=$("results");
  if(!list.length){
    box.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';
    return;
  }
  box.innerHTML=list.slice(0,50).map((p,i)=>{
    const name=val(p,["한글 선수명","선수명","한글 풀네임"])||val(p,["로마자 이름","로마자 풀네임"])||"이름 없음";
    const roman=val(p,["로마자 이름","로마자 풀네임"]);
    const pos=val(p,["포지션"]);
    const team=val(p,["팀","클럽명"]);
    const nation=val(p,["국적","국가"]);
    return `<div class="result" data-i="${i}">
      <div><div class="result-name">${esc(name)}</div>
      <div class="result-meta">${esc([roman,pos,team,nation].filter(Boolean).join(" · "))}</div></div>
      <div class="badge">${esc(pos||"PLAYER")}</div>
    </div>`;
  }).join("");
  box.querySelectorAll(".result").forEach(el=>{
    el.addEventListener("click",()=>showDetail(list[Number(el.dataset.i)]));
  });
}
function showDetail(p){
  $("results").style.display="none";
  const d=$("detail");
  const name=val(p,["한글 선수명","선수명","한글 풀네임"])||"이름 없음";
  const roman=val(p,["로마자 이름","로마자 풀네임"]);
  const fields=[
    ["등번호",val(p,["등번호"])],
    ["포지션",val(p,["포지션"])],
    ["세부 포지션",val(p,["세부 포지션"])],
    ["팀",val(p,["팀","클럽명"])],
    ["국적",val(p,["국적","국가"])],
    ["생년월일",val(p,["생년월일"])],
    ["주발",val(p,["주발"])],
    ["키",val(p,["키"])],
    ["몸무게",val(p,["몸무게"])],
    ["비고",val(p,["비고"])]
  ].filter(x=>x[1]);
  d.innerHTML=`<div class="detail-head">
    <div class="avatar">${esc(name.slice(0,1))}</div>
    <div><h2>${esc(name)}</h2><div class="detail-sub">${esc(roman)}</div></div>
  </div>
  <div class="detail-grid">${fields.map(x=>`<div class="detail-item"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join("")}</div>
  <button class="back" onclick="closeDetail()">← 검색 결과로</button>`;
  d.classList.add("show");
}
function closeDetail(){
  $("detail").classList.remove("show");
  $("results").style.display="grid";
}
function goHome(){
  $("search").value="";
  closeDetail();
  $("results").innerHTML='<div class="empty">검색창을 눌러 검색 유형을 선택하세요.</div>';
}
function browse(){
  alert("축구 정보 찾아보기 페이지는 다음 단계에서 연결합니다.");
}

$("search").addEventListener("focus",()=>$("searchMenu").classList.add("show"));
$("search").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){$("results").innerHTML='<div class="empty">검색어를 입력하면 결과가 표시됩니다.</div>';return;}
  const found=players.filter(p=>searchable(p).some(v=>String(v).toLowerCase().includes(q)));
  renderResults(found);
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".search-wrap")) $("searchMenu").classList.remove("show");
});
document.querySelectorAll(".type-btn").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".type-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    searchType=b.dataset.type;
    $("search").focus();
    $("searchMenu").classList.remove("show");
  });
});
loadPlayers();
</script>
</body>
</html>
