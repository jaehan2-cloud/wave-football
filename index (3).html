<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAVE FOOTBALL</title>
<style>
*{box-sizing:border-box}
:root{--bg:#101114;--panel:#17191d;--panel2:#1c1f24;--panel3:#202329;--line:#2b2e35;--text:#fff;--muted:#9297a3;--accent:#6d75ff;--accent2:#858cff;--good:#72d68a}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}
body{min-width:0;overflow-x:hidden}button,input{font:inherit}button{color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:210px minmax(0,1fr) 210px}
.sidebar{background:var(--panel);padding:26px 18px;border-right:1px solid var(--line);min-width:0}.sidebar.right{border-right:0;border-left:1px solid var(--line)}
.brand{font-size:23px;font-weight:800;letter-spacing:.3px;margin:0 0 32px;cursor:pointer;line-height:1.1;white-space:nowrap}
.section-title{font-size:12px;color:var(--muted);margin:0 0 12px}.fav{display:flex;align-items:center;gap:9px;width:100%;padding:10px 8px;border:0;background:transparent;border-radius:8px;text-align:left;cursor:pointer;color:#ddd;white-space:nowrap}.fav:hover{background:#202329}
.center{min-width:0;padding:34px 46px}.center-inner{width:100%;max-width:1120px;margin:0 auto}.topline{height:24px;margin-bottom:42px}
.search-wrap{position:relative}.search{width:100%;height:62px;padding:0 22px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:#fff;outline:none;font-size:18px}.search:focus{border-color:var(--accent)}.search::placeholder{color:#747986}
.search-menu{display:none;position:absolute;z-index:20;top:70px;left:0;right:0;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;box-shadow:0 15px 40px #0008}.search-menu.show{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.type-btn{padding:13px 10px;border:1px solid var(--line);border-radius:9px;background:#202329;color:#ddd;cursor:pointer}.type-btn:hover,.type-btn.active{background:#292d45;border-color:var(--accent);color:#fff}
.status{margin:14px 0 0;color:var(--muted);font-size:13px}.results{margin-top:22px;display:grid;gap:9px}.result{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}.result:hover{border-color:#555b72;background:#1b1e24}.result-name{font-size:17px;font-weight:700}.result-meta{margin-top:5px;color:var(--muted);font-size:13px}.badge{font-size:12px;color:#b9beff;background:#292d4d;padding:5px 8px;border-radius:6px}.empty{color:#777d88;text-align:center;padding:55px 10px}
.detail{display:none;margin-top:0;padding:30px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.detail.show{display:block}.home-view.hidden{display:none}.page-title{display:flex;align-items:center;gap:14px;margin-bottom:24px}.page-title h1{margin:0;font-size:30px}.page-back{margin-bottom:22px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:#202329;cursor:pointer}.detail-head{padding-bottom:24px;border-bottom:1px solid var(--line)}.detail-head{display:flex;gap:20px;align-items:center}.avatar,.photo{width:82px;height:82px;border-radius:14px;background:#252830;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;color:#aeb3ff;object-fit:cover;flex:none}.detail h2{margin:0 0 6px;font-size:25px}.detail-sub{color:var(--muted);font-size:14px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.detail-item{padding:12px;background:#1d2025;border-radius:9px;min-width:0}.detail-item span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.detail-item b{font-size:14px;word-break:break-word}
.tabs{display:flex;gap:7px;margin-top:22px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:transparent;color:var(--muted);padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:#fff;border-bottom-color:var(--accent)}.tab-panel{display:none;padding-top:18px}.tab-panel.active{display:block}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.data-table{width:100%;border-collapse:collapse;min-width:650px;font-size:12px}.data-table th,.data-table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.data-table th{color:#aeb3bf;background:#1d2025;font-weight:600}.data-table tr:last-child td{border-bottom:0}.data-table td{color:#eee}.table-empty{padding:24px;color:var(--muted);background:#1d2025;border-radius:10px}
.back{margin-top:20px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:#202329;cursor:pointer}.browse{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;text-align:left;font-weight:700}.browse:hover{border-color:var(--accent)}.right-note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.6}
.loading{color:var(--muted);padding:20px 0}.error{color:#ff7b7b;padding:20px 0}
@media(max-width:1100px){.app{grid-template-columns:180px minmax(0,1fr) 180px}.center{padding:28px 24px}.detail-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar,.sidebar.right{display:none}.center{padding:22px 16px}.topline{height:0;margin-bottom:22px}.search-menu.show{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}.detail{padding:18px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand" onclick="goHome()">WAVE FOOTBALL</div>
  <div class="section-title">즐겨찾기</div>
  <button class="fav">🏴 프리미어리그</button><button class="fav">🇪🇸 라리가</button><button class="fav">🇮🇹 세리에 A</button><button class="fav">🇩🇪 분데스리가</button><button class="fav">🇰🇷 K리그1</button>
</aside>
<main class="center"><div class="center-inner">
  <div id="homeView" class="home-view">
  <div class="topline"></div>
  <div class="search-wrap">
    <input id="search" class="search" autocomplete="off" placeholder="선수명, 팀명, 국가를 검색하세요.">
    <div id="searchMenu" class="search-menu">
      <button class="type-btn active" data-type="all">전체 검색</button><button class="type-btn" data-type="player">선수명 검색</button><button class="type-btn" data-type="team">팀명 검색</button><button class="type-btn" data-type="country">국가 검색</button>
    </div>
  </div>
  <div id="status" class="status">Google Sheets에서 데이터를 불러오는 중...</div>
  <div id="results" class="results"><div class="empty">검색창을 눌러 검색 유형을 선택하세요.</div></div>
  </div>
  <section id="detail" class="detail"></section>
</div></main>
<aside class="sidebar right"><button class="browse" onclick="browse()">⚽ 축구 정보 찾아보기</button><div class="right-note">국가, 리그, 클럽, 유스, 포지션, 생일 등 여러 기준으로 선수를 찾아볼 수 있는 공간입니다.</div></aside>
</div>
<script>
const SHEET_ID="11FaYvh3o4v-qkKbaLWcUgQYAAeXidX0rx6m3NsnRnY8";
const SHEETS={players:"선수",stats:"스탯",transfers:"이적",youth:"유스"};
let players=[],stats=[],transfers=[],youth=[],searchType="all",currentPlayer=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function val(o,names){for(const n of names)if(o[n]!==undefined&&String(o[n]).trim()!=="")return String(o[n]);return ""}
function parseGviz(text){const a=text.indexOf("{"),b=text.lastIndexOf("}");if(a<0||b<0)throw new Error("Google Sheets 응답을 읽을 수 없습니다.");const d=JSON.parse(text.slice(a,b+1));const cols=d.table.cols.map(c=>c.label||"");return d.table.rows.map(r=>{const o={};cols.forEach((c,i)=>o[c]=r.c?.[i]?.v!=null?String(r.c[i].v):"");return o})}
async function loadSheet(sheet){const url="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&sheet="+encodeURIComponent(sheet);const r=await fetch(url);if(!r.ok)throw new Error("HTTP "+r.status);return parseGviz(await r.text())}
async function loadData(){
  try{
    [players,stats,transfers,youth]=await Promise.all([loadSheet(SHEETS.players),loadSheet(SHEETS.stats),loadSheet(SHEETS.transfers),loadSheet(SHEETS.youth)]);
    $("status").textContent=`Google Sheets 연결 성공 · 선수 ${players.length}명 · 스탯 ${stats.length}건 · 이적 ${transfers.length}건 · 유스 ${youth.length}건`;
    $("status").style.color="var(--good)";
  }catch(e){
    try{players=await loadSheet(SHEETS.players);$("status").textContent=`선수 데이터 연결 성공 · ${players.length}명 (일부 시트는 아직 불러오지 못했습니다)`;$("status").style.color="var(--good)"}
    catch(err){$("status").textContent="Google Sheets 연결 실패: "+err.message;$("status").style.color="#ff7b7b"}
  }
}
function playerName(p){return val(p,["한글 선수명","선수명","한글 풀네임"])||val(p,["로마자 이름","로마자 풀네임"])||"이름 없음"}
function samePlayer(row,p){const a=[val(row,["선수명","한글 선수명","선수명(한글)"]),val(row,["한글 풀네임"]),val(row,["로마자 이름","로마자 풀네임"])].filter(Boolean).map(x=>x.trim().toLowerCase());const b=[playerName(p),val(p,["한글 풀네임"]),val(p,["로마자 이름","로마자 풀네임"])].filter(Boolean).map(x=>x.trim().toLowerCase());return a.some(x=>b.includes(x))}
function searchable(p){if(searchType==="player")return [playerName(p),val(p,["한글 풀네임"]),val(p,["로마자 이름","로마자 풀네임"])];if(searchType==="team")return [val(p,["팀","클럽명"])];if(searchType==="country")return [val(p,["국적","국가"])];return Object.values(p)}
function renderResults(list){const box=$("results");if(!list.length){box.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}box.innerHTML=list.slice(0,50).map((p,i)=>{const name=playerName(p),roman=val(p,["로마자 이름","로마자 풀네임"]),pos=val(p,["포지션"]),team=val(p,["팀","클럽명"]),nation=val(p,["국적","국가"]);return `<div class="result" data-i="${i}"><div><div class="result-name">${esc(name)}</div><div class="result-meta">${esc([roman,pos,team,nation].filter(Boolean).join(" · "))}</div></div><div class="badge">${esc(pos||"PLAYER")}</div></div>`}).join("");box.querySelectorAll(".result").forEach(el=>el.addEventListener("click",()=>showDetail(list[Number(el.dataset.i)])))}
function detailItem(label,value){return value?`<div class="detail-item"><span>${esc(label)}</span><b>${esc(value)}</b></div>`:""}
function photoHtml(p,name){const photo=val(p,["사진","사진 URL","사진URL"]);return photo?`<img class="photo" src="${esc(photo)}" alt="${esc(name)}" onerror="this.outerHTML='<div class=\"avatar\">${esc(name.slice(0,1))}</div>'">`:`<div class="avatar">${esc(name.slice(0,1))}</div>`}
function showDetail(p){
  currentPlayer=p;
  const d=$("detail"), name=playerName(p), roman=val(p,["로마자 이름","로마자 풀네임"]);
  const fields=[["등번호",val(p,["등번호"])],["포지션",val(p,["포지션"])],["세부 포지션",val(p,["세부 포지션"])],["팀",val(p,["팀","클럽명"])],["국적",val(p,["국적","국가"])],["생년월일",val(p,["생년월일"])],["주발",val(p,["주발"])],["키",val(p,["키"])],["몸무게",val(p,["몸무게"])],["비고",val(p,["비고"])]];
  d.innerHTML=`<button class="page-back" onclick="closeDetail()">← 검색으로 돌아가기</button>
  <div class="page-title"><h1>${esc(name)}</h1><div class="badge">선수</div></div>
  <div class="detail-head"><div class="detail-head">${photoHtml(p,name)}<div><h2>${esc(name)}</h2><div class="detail-sub">${esc(roman)}</div></div></div></div>
  <div class="detail-grid">${fields.map(x=>detailItem(x[0],x[1])).join("")}</div>
  <div class="tabs"><button class="tab active" data-tab="basic">기본 정보</button><button class="tab" data-tab="stats">시즌 스탯</button><button class="tab" data-tab="transfers">이적 기록</button><button class="tab" data-tab="youth">유스 경력</button></div>
  <div id="panel-basic" class="tab-panel active"><div class="table-empty">선수의 기본 정보입니다.</div></div>
  <div id="panel-stats" class="tab-panel">${renderStats(p)}</div>
  <div id="panel-transfers" class="tab-panel">${renderTransfers(p)}</div>
  <div id="panel-youth" class="tab-panel">${renderYouth(p)}</div>`;
  $("homeView").classList.add("hidden");
  d.classList.add("show");
  history.pushState({player:playerName(p)},"", "#player="+encodeURIComponent(playerName(p)));
  d.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>switchTab(tab.dataset.tab)));
  window.scrollTo({top:0,behavior:"smooth"});
}
function switchTab(tab){$("detail").querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));$("detail").querySelectorAll(".tab-panel").forEach(x=>x.classList.toggle("active",x.id==="panel-"+tab))}
function table(headers,rows){if(!rows.length)return '<div class="table-empty">등록된 데이터가 없습니다.</div>';return `<div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function renderStats(p){const rows=stats.filter(r=>samePlayer(r,p));if(!rows.length)return '<div class="table-empty">이 선수의 스탯 데이터가 아직 없습니다.</div>';const headers=["시즌","대회","명단 포함","출전","출전 시간","선발 출전","교체 출전","골","어시스트","옐로카드","레드카드","패스 성공률","성공 패스","클린시트","선방률","총 선방"];return table(headers,rows.map(r=>headers.map(h=>val(r,[h]))))}
function renderTransfers(p){const rows=transfers.filter(r=>samePlayer(r,p));if(!rows.length)return '<div class="table-empty">이적 기록이 아직 없습니다.</div>';const headers=["합류일","이전 팀","이전 팀 국가","이적 팀","이적 팀 국가"];return table(headers,rows.map(r=>headers.map(h=>val(r,[h]))))}
function renderYouth(p){const rows=youth.filter(r=>samePlayer(r,p));if(!rows.length)return '<div class="table-empty">유스 경력이 아직 없습니다.</div>';const headers=["합류일","이전 팀","이전 팀 국가","이적 팀","이적 팀 국가"];return table(headers,rows.map(r=>headers.map(h=>val(r,[h]))))}
function closeDetail(){currentPlayer=null;$("detail").classList.remove("show");$("homeView").classList.remove("hidden");$("results").style.display="grid";if(location.hash)history.pushState({},"",location.pathname+location.search);window.scrollTo({top:0,behavior:"smooth"})}
function goHome(){$("search").value="";closeDetail();$("results").innerHTML='<div class="empty">검색창을 눌러 검색 유형을 선택하세요.</div>';window.scrollTo({top:0,behavior:"smooth"})}
function browse(){alert("축구 정보 찾아보기 페이지는 다음 단계에서 연결합니다.")}
$("search").addEventListener("focus",()=>$('searchMenu').classList.add("show"));
$("search").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();if(!q){$("results").innerHTML='<div class="empty">검색어를 입력하면 결과가 표시됩니다.</div>';return}const found=players.filter(p=>searchable(p).some(v=>String(v).toLowerCase().includes(q)));renderResults(found)});
document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))$("searchMenu").classList.remove("show")});
document.querySelectorAll(".type-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".type-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");searchType=b.dataset.type;$("search").focus();$("searchMenu").classList.remove("show");}));
window.addEventListener("popstate",()=>{if(!location.hash)closeDetail();});
loadData();
</script>
</body></html>
